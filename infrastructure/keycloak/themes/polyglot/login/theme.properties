# Tema di login di Polyglot Commerce.
#
# Eredita dal tema "keycloak" e ne sovrascrive solo il foglio di stile:
# i template FreeMarker restano quelli originali, cosi' un aggiornamento
# di Keycloak non richiede di riallineare a mano pagine che non abbiamo
# scritto (login, registrazione, recupero password, errori...).
#
# "styles" sostituisce il valore del genitore invece di aggiungersi:
# css/login.css e' quello del tema keycloak e va ripetuto, altrimenti le
# pagine perdono il proprio impianto.
parent=keycloak
import=common/keycloak

styles=css/login.css css/polyglot.css
