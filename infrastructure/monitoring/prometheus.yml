# Prometheus in modalità pull: è lui a chiamare i servizi, non il
# contrario. Ogni 15 secondi raccoglie le metriche dagli endpoint qui
# sotto.
#
# `host.docker.internal` perché i servizi applicativi girano sull'host
# (avviati a mano con Maven o uvicorn), non dentro Docker. Quando
# gireranno in Kubernetes questa configurazione sparisce: lì Prometheus
# scopre i target da solo dalle annotazioni sui pod.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:
  # I servizi Spring Boot espongono le metriche su /actuator/prometheus
  # grazie a micrometer-registry-prometheus.
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels: { service: catalog-service }
      - targets: ['host.docker.internal:8082']
        labels: { service: order-service }
      - targets: ['host.docker.internal:8084']
        labels: { service: payment-service }
      - targets: ['host.docker.internal:8085']
        labels: { service: integration-service }

  # Il servizio FastAPI usa prometheus-fastapi-instrumentator, che
  # pubblica su /metrics.
  - job_name: inventory-service
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels: { service: inventory-service }

  # Prometheus misura anche sé stesso: utile per accorgersi se la
  # raccolta sta rallentando.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
