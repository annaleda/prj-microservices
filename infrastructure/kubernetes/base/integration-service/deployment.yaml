apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-service
  namespace: polyglot-commerce
  labels:
    app: integration-service
spec:
  # Una sola replica, a differenza degli altri servizi: l'orchestratore
  # tiene lo stato delle saghe in corso in memoria (vedi SagaStateStore).
  # Con piu' repliche i passi della stessa saga finirebbero su pod diversi,
  # che non conoscono quello stato. Per scalare servirebbe prima uno store
  # condiviso e persistente.
  replicas: 1
  selector:
    matchLabels:
      app: integration-service
  template:
    metadata:
      labels:
        app: integration-service
    spec:
      containers:
        - name: integration-service
          image: polyglot-commerce/integration-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: integration-service-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
