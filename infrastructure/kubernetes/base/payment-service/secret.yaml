# Credenziali di sviluppo in chiaro, allineate a quelle usate da
# docker-compose (vedi .env alla radice del repo). Da NON usare cosi'
# negli overlay staging/production: li' vanno gestite tramite un
# secret manager esterno (vedi "Secret Vault" nelle Future Improvements
# del documento di design) e mai committate in chiaro.
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secret
  namespace: polyglot-commerce
type: Opaque
stringData:
  PAYMENTS_DB_USER: payments
  PAYMENTS_DB_PASSWORD: payments
