apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-service-config
  namespace: polyglot-commerce
data:
  CATALOG_DB_HOST: catalog-db
  CATALOG_DB_PORT: "5432"
  CATALOG_DB_NAME: catalog
  # Il catalogo pubblica product.created, consumato dall'Inventory
  # Service per creare la riga di magazzino del prodotto nuovo.
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Object storage delle immagini. E' l'indirizzo con cui il *servizio*
  # raggiunge MinIO: il browser non ci parla mai, perche' le immagini
  # vengono servite dal catalogo su GET /api/products/{id}/image. Non c'e'
  # quindi il problema dei due URL diversi che affligge Keycloak.
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: product-images
  KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/polyglot-commerce
