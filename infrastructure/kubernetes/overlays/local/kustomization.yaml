apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: catalog-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: inventory-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: payment-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # In locale non esiste ancora un Postgres in-cluster: si riusano i
  # database avviati via docker-compose sull'host, raggiungibili da
  # dentro kind (su Docker Desktop) come host.docker.internal.
  - target:
      kind: ConfigMap
      name: catalog-service-config
    patch: |-
      - op: replace
        path: /data/CATALOG_DB_HOST
        value: host.docker.internal
      - op: replace
        path: /data/CATALOG_DB_PORT
        value: "5434"
  - target:
      kind: ConfigMap
      name: order-service-config
    patch: |-
      - op: replace
        path: /data/ORDERS_DB_HOST
        value: host.docker.internal
      - op: replace
        path: /data/ORDERS_DB_PORT
        value: "5435"
  - target:
      kind: ConfigMap
      name: inventory-service-config
    patch: |-
      - op: replace
        path: /data/INVENTORY_DB_HOST
        value: host.docker.internal
      - op: replace
        path: /data/INVENTORY_DB_PORT
        value: "5437"
  - target:
      kind: ConfigMap
      name: payment-service-config
    patch: |-
      - op: replace
        path: /data/PAYMENTS_DB_HOST
        value: host.docker.internal
      - op: replace
        path: /data/PAYMENTS_DB_PORT
        value: "5436"
  # Stesso discorso per Kafka: il broker gira su docker-compose sull'host
  # ed espone la porta 9094 (listener HOST), non essendoci ancora un Kafka
  # dentro il cluster. integration-service resta a una replica anche qui,
  # come nel base.
  - target:
      kind: ConfigMap
      name: order-service-config
    patch: |-
      - op: replace
        path: /data/KAFKA_BOOTSTRAP_SERVERS
        value: host.docker.internal:9094
  - target:
      kind: ConfigMap
      name: inventory-service-config
    patch: |-
      - op: replace
        path: /data/KAFKA_BOOTSTRAP_SERVERS
        value: host.docker.internal:9094
  - target:
      kind: ConfigMap
      name: payment-service-config
    patch: |-
      - op: replace
        path: /data/KAFKA_BOOTSTRAP_SERVERS
        value: host.docker.internal:9094
  - target:
      kind: ConfigMap
      name: integration-service-config
    patch: |-
      - op: replace
        path: /data/KAFKA_BOOTSTRAP_SERVERS
        value: host.docker.internal:9094
