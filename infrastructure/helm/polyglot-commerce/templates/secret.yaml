{{/*
Un Secret per servizio, solo per quelli che hanno un database o l'accesso
all'object storage.

ATTENZIONE: i valori di default sono credenziali di *sviluppo* in chiaro,
allineate a docker-compose. Fuori dal locale non si fa cosi': i Secret
Kubernetes sono in base64, non cifrati, e chiunque possa leggerli nel
namespace li vede. La strada giusta e' un secret manager esterno
(External Secrets Operator, Vault, o il secret manager del cloud), oppure
sealed-secrets se si vuole tenerli nel repository.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if or $svc.database $svc.features.minio }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secret
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "polyglot.labels" (dict "name" $name "release" $.Release.Name "chart" (printf "%s-%s" $.Chart.Name $.Chart.Version)) | nindent 4 }}
type: Opaque
stringData:
  {{- with $svc.database }}
  {{ .envPrefix }}_DB_USER: {{ .user | quote }}
  {{ .envPrefix }}_DB_PASSWORD: {{ .password | quote }}
  {{- end }}
  {{- if $svc.features.minio }}
  MINIO_ACCESS_KEY: {{ $.Values.minio.accessKey | quote }}
  MINIO_SECRET_KEY: {{ $.Values.minio.secretKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
