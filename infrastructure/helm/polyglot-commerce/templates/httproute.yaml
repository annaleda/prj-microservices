{{/*
Un HTTPRoute per ogni servizio che espone rotte pubbliche.

L'Integration Service ha `routes: []` e quindi non ne ottiene nessuno:
parla solo per eventi, non ha API da esporre.

Nella Gateway API l'HTTPRoute e' la risorsa che scrive *chi sviluppa
l'applicazione*, mentre il Gateway lo scrive chi gestisce il cluster. E'
la separazione di ruoli che Ingress non aveva.
*/}}
{{- if .Values.gateway.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "polyglot.labels" (dict "name" $name "release" $.Release.Name "chart" (printf "%s-%s" $.Chart.Name $.Chart.Version)) | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
  rules:
    - matches:
        {{- range $svc.routes }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: {{ $name }}
          port: 80
{{- end }}
{{- end }}
{{- end }}
