server:
  port: 8082

spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak (docker-compose). Il servizio scarica da qui le chiavi
          # pubbliche con cui verifica la firma dei token: non c'e' nessun
          # segreto condiviso con l'identity provider.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/polyglot-commerce}
  datasource:
    url: jdbc:postgresql://${ORDERS_DB_HOST:localhost}:${ORDERS_DB_PORT:5435}/${ORDERS_DB_NAME:orders}
    username: ${ORDERS_DB_USER:orders}
    password: ${ORDERS_DB_PASSWORD:orders}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      # Ogni metrica porta il nome del servizio: senza, in Prometheus i
      # dati dei cinque servizi si sommerebbero indistinguibili.
      application: ${spring.application.name}
    distribution:
      # Istogrammi delle latenze HTTP. La media non serve a niente:
      # servono i percentili, e il p99 alto con media buona significa
      # che una richiesta su cento va male - e quella e' di qualcuno.
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

springdoc:
  swagger-ui:
    path: /swagger-ui.html
