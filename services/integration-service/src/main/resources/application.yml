server:
  port: 8085

spring:
  application:
    name: integration-service

camel:
  springboot:
    name: integration-service
  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      # Ogni metrica porta il nome del servizio: senza, in Prometheus i
      # dati dei cinque servizi si sommerebbero indistinguibili.
      application: ${spring.application.name}
    distribution:
      # Istogrammi delle latenze HTTP. La media non serve a niente:
      # servono i percentili, e il p99 alto con media buona significa
      # che una richiesta su cento va male - e quella e' di qualcuno.
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
