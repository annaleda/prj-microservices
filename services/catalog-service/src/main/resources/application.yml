server:
  port: 8081

spring:
  application:
    name: catalog-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  servlet:
    multipart:
      # Tetto lato framework, oltre a quello controllato nel servizio: una
      # richiesta enorme viene respinta prima di essere letta in memoria.
      max-file-size: 5MB
      max-request-size: 6MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak (docker-compose). Il servizio scarica da qui le chiavi
          # pubbliche con cui verifica la firma dei token: non c'e' nessun
          # segreto condiviso con l'identity provider.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/polyglot-commerce}
  datasource:
    url: jdbc:postgresql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:5434}/${CATALOG_DB_NAME:catalog}
    username: ${CATALOG_DB_USER:catalog}
    password: ${CATALOG_DB_PASSWORD:catalog}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Object storage delle immagini dei prodotti (MinIO in locale). L'endpoint
# e' quello che raggiunge *questo servizio*; il browser non parla mai con
# MinIO, perche' le immagini le serve il catalogo su
# GET /api/products/{id}/image.
storage:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:product-images}
