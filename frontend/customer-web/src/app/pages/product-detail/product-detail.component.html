<section class="detail" *ngIf="product$ | async as product; else errorOrLoading">
  <a routerLink="/" class="detail__back">&larr; Torna al catalogo</a>

  <div class="detail__panel card">
    <div class="detail__media">
      <img
        *ngIf="showPhoto(product); else noPhoto"
        class="detail__photo"
        [src]="product.imageUrl"
        [alt]="product.name"
        (click)="openLightbox()"
        title="Clicca per ingrandire"
        (error)="onImageError()"
      />
      <ng-template #noPhoto>
        <span class="detail__thumb" [style.background]="thumbnail(product)" aria-hidden="true">
          {{ product.name.charAt(0) }}
        </span>
      </ng-template>
    </div>

    <!-- Immagine a tutto schermo. Il fondo e' cliccabile per chiudere,
         come ci si aspetta da una finestra sovrapposta; c'e' anche la
         X, e Esc funziona (gestito nel componente). -->
    <div
      *ngIf="lightboxOpen && showPhoto(product)"
      class="lightbox"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="product.name"
      (click)="closeLightbox()"
    >
      <button type="button" class="lightbox__close" title="Chiudi" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
      <!-- Il clic sull'immagine non chiude (chiudere mentre si guarda cio'
           che si e' appena aperto e' fastidioso): ingrandisce. -->
      <img
        [src]="product.imageUrl"
        [alt]="product.name"
        [class.lightbox__image--zoomed]="lightboxZoomed"
        [style.transform-origin]="lightboxOrigin"
        [attr.title]="lightboxZoomed ? 'Clicca per ridurre' : 'Clicca per ingrandire'"
        (click)="toggleLightboxZoom($event)"
        (mousemove)="onLightboxMove($event)"
      />
    </div>

    <div class="detail__info">
      <span class="detail__category">{{ product.categoryName }}</span>
      <h1>{{ product.name }}</h1>
      <p class="detail__price">{{ product.price | currency: 'EUR' }}</p>
      <p class="detail__description">{{ product.description }}</p>
      <p class="detail__sku">SKU {{ product.sku }}</p>
      <div class="detail__actions">
        <button
          type="button"
          class="detail__action detail__action--add"
          (click)="addToCart(product)"
          title="Aggiungi al carrello"
          [attr.aria-label]="'Aggiungi ' + product.name + ' al carrello'"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>

        <!-- Il carrello e' una destinazione, non un'azione sul prodotto:
             e' un link, cosi' funziona anche aperto in una scheda nuova. -->
        <a
          class="detail__action"
          routerLink="/checkout"
          title="Vai al carrello"
          aria-label="Vai al carrello"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.5 3.5h2.2l2.4 11.6a1.6 1.6 0 0 0 1.6 1.3h8.3a1.6 1.6 0 0 0 1.6-1.3l1.4-7.4H5.4" />
            <circle cx="9.5" cy="20" r="1.4" />
            <circle cx="17.5" cy="20" r="1.4" />
          </svg>
        </a>
      </div>
    </div>
  </div>
</section>

<ng-template #errorOrLoading>
  <p *ngIf="loadError; else loading" class="detail__error">
    Prodotto non trovato o catalog-service non raggiungibile.
  </p>
  <ng-template #loading>
    <p>Caricamento…</p>
  </ng-template>
</ng-template>
