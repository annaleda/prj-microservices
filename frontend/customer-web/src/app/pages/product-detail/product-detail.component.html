<section class="detail" *ngIf="product$ | async as product; else errorOrLoading">
  <a routerLink="/" class="detail__back">&larr; Torna al catalogo</a>

  <div class="detail__panel card">
    <div class="detail__media">
      <img
        *ngIf="showPhoto(product); else noPhoto"
        class="detail__photo"
        [src]="product.imageUrl"
        [alt]="product.name"
        (error)="onImageError()"
      />
      <ng-template #noPhoto>
        <span class="detail__thumb" [style.background]="thumbnail(product)" aria-hidden="true">
          {{ product.name.charAt(0) }}
        </span>
      </ng-template>
    </div>

    <div class="detail__info">
      <span class="detail__category">{{ product.categoryName }}</span>
      <h1>{{ product.name }}</h1>
      <p class="detail__price">{{ product.price | currency: 'EUR' }}</p>
      <p class="detail__description">{{ product.description }}</p>
      <p class="detail__sku">SKU {{ product.sku }}</p>
      <button (click)="addToCart(product)">Aggiungi al carrello</button>
    </div>
  </div>
</section>

<ng-template #errorOrLoading>
  <p *ngIf="loadError; else loading" class="detail__error">
    Prodotto non trovato o catalog-service non raggiungibile.
  </p>
  <ng-template #loading>
    <p>Caricamento…</p>
  </ng-template>
</ng-template>
