<section class="catalog">
  <div class="catalog__toolbar">
    <div>
      <h1>Catalogo</h1>
      <p class="catalog__subtitle">Scegli un prodotto e aggiungilo al carrello.</p>
    </div>

    <label class="catalog__filter">
      <span>Categoria</span>
      <select (change)="onCategoryChange($any($event.target).value)">
        <option value="">Tutte</option>
        <option *ngFor="let category of categories$ | async" [value]="category.id">
          {{ category.name }}
        </option>
      </select>
    </label>
  </div>

  <p *ngIf="loadError" class="catalog__error">
    Impossibile caricare i prodotti. Verifica che catalog-service sia in esecuzione.
  </p>

  <div class="catalog__grid">
    <article *ngFor="let product of filteredProducts$ | async" class="product-card card">
      <a [routerLink]="['/products', product.id]" class="product-card__link">
        <img
          *ngIf="showPhoto(product); else noPhoto"
          class="product-card__photo"
          [src]="product.imageUrl"
          [alt]="product.name"
          loading="lazy"
          (error)="onImageError(product)"
        />
        <!-- Senza foto (o se non si carica) una banda colorata derivata dal
             nome: meglio di un riquadro rotto, e il prodotto resta
             riconoscibile a colpo d'occhio. -->
        <ng-template #noPhoto>
          <span class="product-card__thumb" [style.background]="thumbnail(product)" aria-hidden="true">
            {{ product.name.charAt(0) }}
          </span>
        </ng-template>

        <span class="product-card__body">
          <span class="product-card__category">{{ product.categoryName }}</span>
          <h2>{{ product.name }}</h2>
          <span class="product-card__price">{{ product.price | currency: 'EUR' }}</span>
        </span>
      </a>

      <button (click)="addToCart(product, $event)">Aggiungi al carrello</button>
    </article>
  </div>
</section>
