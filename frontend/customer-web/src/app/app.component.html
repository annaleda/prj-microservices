<header class="app-header">
  <a routerLink="/" class="app-header__brand">
    <span class="app-header__mark" aria-hidden="true">PC</span>
    Polyglot Commerce
  </a>

  <nav class="app-header__nav">
    <!-- Voce esplicita per il catalogo: il nome del negozio riporta alla
         home, ma non e' un appiglio evidente, e dalle altre pagine
         (storico, checkout) sarebbe l'unico modo per tornare indietro. -->
    <a
      routerLink="/"
      class="app-header__action"
      routerLinkActive="app-header__action--active"
      [routerLinkActiveOptions]="{ exact: true }"
      title="Catalogo"
      aria-label="Catalogo"
    >
      <!-- Griglia di prodotti: sfogliare il catalogo. -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7.5" height="7.5" rx="1.5" />
        <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" />
        <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" />
        <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5" />
      </svg>
    </a>

    <a
      *ngIf="auth.isLoggedIn"
      routerLink="/orders"
      class="app-header__action"
      routerLinkActive="app-header__action--active"
      title="I miei ordini"
      aria-label="I miei ordini"
    >
      <!-- Scontrino: lo storico degli ordini gia' effettuati. -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 2h12v20l-3-2-3 2-3-2-3 2z" />
        <path d="M9.5 7.5h5M9.5 11.5h5M9.5 15.5h3" />
      </svg>
    </a>

    <a
      routerLink="/checkout"
      class="app-header__action"
      routerLinkActive="app-header__action--active"
      title="Carrello"
      [attr.aria-label]="'Carrello, ' + (cartCount$ | async) + ' articoli'"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 3.5h2.2l2.4 11.6a1.6 1.6 0 0 0 1.6 1.3h8.3a1.6 1.6 0 0 0 1.6-1.3l1.4-7.4H5.4" />
        <circle cx="9.5" cy="20" r="1.4" />
        <circle cx="17.5" cy="20" r="1.4" />
      </svg>
      <!-- Con zero articoli l'espressione e' falsy e il contatore non
           viene disegnato: un "0" perenne accanto all'icona e' rumore. -->
      <span class="app-header__badge" *ngIf="(cartCount$ | async) as count">{{ count }}</span>
    </a>

    <span class="app-header__auth">
      <ng-container *ngIf="auth.isLoggedIn; else loggedOut">
        <span class="app-header__user">{{ auth.username }}</span>
        <button type="button" class="ghost" (click)="auth.logout()">Esci</button>
      </ng-container>
      <ng-template #loggedOut>
        <button type="button" class="ghost" (click)="auth.login()">Accedi</button>
        <button type="button" (click)="auth.register()">Registrati</button>
      </ng-template>
    </span>
  </nav>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>
