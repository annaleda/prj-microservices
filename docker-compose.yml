services:
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - commerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-db
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME}
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    ports:
      - "${CATALOG_DB_PORT}:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    networks:
      - commerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER} -d ${CATALOG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders-db:
    image: postgres:16-alpine
    container_name: orders-db
    environment:
      POSTGRES_DB: ${ORDERS_DB_NAME}
      POSTGRES_USER: ${ORDERS_DB_USER}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD}
    ports:
      - "${ORDERS_DB_PORT}:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    networks:
      - commerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDERS_DB_USER} -d ${ORDERS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  payments-db:
    image: postgres:16-alpine
    container_name: payments-db
    environment:
      POSTGRES_DB: ${PAYMENTS_DB_NAME}
      POSTGRES_USER: ${PAYMENTS_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD}
    ports:
      - "${PAYMENTS_DB_PORT}:5432"
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    networks:
      - commerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENTS_DB_USER} -d ${PAYMENTS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-db:
    image: postgres:16-alpine
    container_name: inventory-db
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
    ports:
      - "${INVENTORY_DB_PORT}:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks:
      - commerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER} -d ${INVENTORY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics-db:
    image: mongo:7
    container_name: analytics-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${ANALYTICS_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${ANALYTICS_DB_NAME}
    ports:
      - "${ANALYTICS_DB_PORT}:27017"
    volumes:
      - analytics-db-data:/data/db
    networks:
      - commerce-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME}
      KC_DB_USERNAME: ${AUTH_DB_USER}
      KC_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      # Il realm viene importato all'avvio invece di essere configurato a
      # mano dalla console: la configurazione (ruoli, client, utenti demo)
      # sta nel repository ed e' ricreabile da zero.
      - ./infrastructure/keycloak/realm-polyglot-commerce.json:/opt/keycloak/data/import/realm.json:ro
      # Tema di login/registrazione con la grafica dell'applicazione.
      - ./infrastructure/keycloak/themes:/opt/keycloak/themes:ro
    networks:
      - commerce-network
    healthcheck:
      # L'immagine di Keycloak non ha curl ne' wget: si verifica con bash
      # che la porta HTTP accetti connessioni.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "${KAFKA_HOST_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - commerce-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/init-topics.sh:/init-topics.sh
    entrypoint: ["/bin/sh", "/init-topics.sh"]
    networks:
      - commerce-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - commerce-network

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # 9000: API S3 (la usa il Catalog Service). 9001: console web.
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - commerce-network

  minio-init:
    # Container "one-shot" che crea il bucket, come kafka-init per i topic.
    # Il bucket resta privato: le immagini le serve il Catalog Service, che
    # e' gia' il proprietario del catalogo e ne conosce le regole di
    # accesso. Un bucket pubblico obbligherebbe a salvare nel database un
    # URL assoluto di MinIO, che cambia fra locale e cluster.
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      echo 'Bucket ready:' && mc ls local
      "
    networks:
      - commerce-network

  # ---------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Necessario perche' Grafana possa interrogarlo dietro il proxy.
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # I servizi applicativi girano sull'host, non in Docker: senza
      # questo, dentro il container `host.docker.internal` non risolve
      # su Linux (su Docker Desktop funziona gia').
      - "host.docker.internal:host-gateway"
    networks:
      - commerce-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Niente registrazione ne' anonimi: e' un ambiente locale, ma le
      # impostazioni di default di Grafana non vanno lasciate come sono.
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    networks:
      - commerce-network

  jaeger:
    # all-in-one: raccoglie, memorizza (in memoria) e mostra le trace.
    #
    # Accetta OTLP direttamente, quindi non serve un OpenTelemetry
    # Collector in mezzo. In produzione il Collector ci starebbe: e' lui
    # a fare campionamento, filtri e instradamento verso piu' backend.
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT}:16686"        # interfaccia web
      - "${JAEGER_OTLP_GRPC_PORT}:4317"  # OTLP gRPC, usato dagli agent
      - "${JAEGER_OTLP_HTTP_PORT}:4318"  # OTLP HTTP
    networks:
      - commerce-network

networks:
  commerce-network:
    driver: bridge

volumes:
  auth-db-data:
  catalog-db-data:
  orders-db-data:
  payments-db-data:
  kafka-data:
  inventory-db-data:
  analytics-db-data:
  minio-data:
  prometheus-data:
  grafana-data:
